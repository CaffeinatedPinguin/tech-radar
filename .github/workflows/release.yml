name: release

# A version tag is the release contract: validate the exact package version,
# build the application once, publish the matching GHCR image, and create a
# GitHub Release containing the commits since the previous version tag.
on:
  push:
    tags:
      - "v*.*.*"

# A release for a commit supersedes the ordinary main-branch CI for that same
# commit. CI remains non-cancellable so an in-progress release is authoritative.
concurrency:
  group: tech-radar-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: tech-radar / release verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Validate tag against package.json version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected ${expected})"
            exit 1
          fi
          echo "Release tag ${GITHUB_REF_NAME} matches package.json version ${version}."

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-tech-radar-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-tech-radar-${{ runner.os }}-

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          npm install -g corepack@0.36.0
          corepack enable
          corepack prepare pnpm@12.2.1 --activate

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Validate content
        shell: bash
        run: corepack pnpm content:build

      - name: Test
        shell: bash
        run: corepack pnpm test

      - name: Lint
        shell: bash
        run: corepack pnpm lint

      - name: Typecheck
        shell: bash
        run: corepack pnpm typecheck

      - name: Build frontend
        shell: bash
        run: corepack pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tech-radar-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  docker:
    name: tech-radar / publish Docker image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tech-radar-dist
          path: dist

      - name: Set image reference
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/tech-radar"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "IMAGE_URL=https://github.com/${GITHUB_REPOSITORY}/pkgs/container/tech-radar" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish image
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE}:${RELEASE_TAG}"
          docker build --pull --target runtime-prebuild \
            --tag "${image_tag}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" \
            .
          docker push "${image_tag}"
          docker image inspect "${image_tag}" >/dev/null

  release:
    name: GitHub release
    needs: [verify, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/tech-radar"
          registry_url="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/tech-radar"
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            if [[ -n "${previous}" ]]; then
              range="${previous}..${TAG}"
              echo "Commits since \`${previous}\`:"
            else
              range="${TAG}"
              echo "Commits included in this release:"
            fi
            echo
            if git log --format='%h %s' "${range}" | grep -q .; then
              git log --format='- `%h` %s' "${range}"
            else
              echo "- No commits recorded for this range."
            fi
            echo
            echo "## Docker image"
            echo
            echo "- Pull: \`docker pull ${image}:${TAG}\`"
            echo "- Image: \`${image}:${TAG}\`"
            echo "- Package URL: [Open the container package](${registry_url})"
          } > release-notes.md

      - name: Create GitHub release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --verify-tag \
            --title "Tech Radar ${TAG}" \
            --notes-file release-notes.md
