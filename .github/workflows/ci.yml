name: ci

# Single thin caller for the project CI: verify (content build, test, lint,
# typecheck, build), Docker image build with a smoke test, and the tag-driven
# release.
# Tag runs share the SHA-based group with branch runs: a release tag cancels the
# CI run for the same commit, while CI never cancels an in-progress release.
# Pull requests are "Collaborators only"; PR runs never receive secrets, and the
# registry push and release jobs only run for tags.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to verify (checked out as refs/pull/<n>/head)
        required: false
        default: ""
        type: string

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  verify:
    name: verify
    permissions:
      contents: read
    uses: CaffeinatedPinguin/templates/.github/workflows/node-ci.yml@5491a12df1b2726588c95517f6790aeb7e332b63
    with:
      # A manual run can verify an untrusted PR head without a pull_request trigger.
      ref: ${{ github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || '' }}
      scripts: content:build test lint typecheck build
      node-version-file: .nvmrc
      artifact-name: dist
      artifact-path: dist
      check-release-tag: true

  docker:
    name: docker
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: CaffeinatedPinguin/templates/.github/workflows/docker.yml@5491a12df1b2726588c95517f6790aeb7e332b63
    with:
      image-name: tech-radar
      # Build the Dockerfile and dist from the same commit as verify.
      ref: ${{ github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || '' }}
      context: .
      dockerfile: Dockerfile
      target: runtime-prebuild
      artifact-name: dist
      artifact-path: dist
      smoke-paths: / /content/content.json /logo/logo.svg
      push: ${{ startsWith(github.ref, 'refs/tags/') }}

  release:
    name: release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: CaffeinatedPinguin/templates/.github/workflows/release.yml@5491a12df1b2726588c95517f6790aeb7e332b63
    with:
      title-prefix: "Tech Radar "
      image-name: tech-radar

  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    permissions: {}
    uses: CaffeinatedPinguin/templates/.github/workflows/conventions.yml@5491a12df1b2726588c95517f6790aeb7e332b63

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: CaffeinatedPinguin/templates/.github/workflows/dependency-review.yml@5491a12df1b2726588c95517f6790aeb7e332b63
    with:
      fail-on-severity: high

  # The baseline required check. It never fails the run itself for a skipped
  # job, but fails when any needed job failed or was cancelled.
  ci-required:
    name: ci-required
    if: always()
    needs: [conventions, dependency-review, verify, docker, release]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: All jobs green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [[ "$r" == success || "$r" == skipped ]] || { echo "::error::job result: $r"; exit 1; }
          done
