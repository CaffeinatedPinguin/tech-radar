name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to verify (checked out as refs/pull/<n>/head)
        required: false
        default: ""
        type: string

# Tag and branch runs share the SHA-based group: a release tag cancels the CI
# run for the same commit, while CI never cancels an in-progress release.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  verify:
    name: verify
    permissions:
      contents: read
    uses: CaffeinatedPinguin/templates/.github/workflows/node-ci.yml@19ceee944e703de7ea0291518ada59442f387c96
    with:
      # A manual run can verify an untrusted PR head without a pull_request trigger.
      ref: ${{ github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || '' }}
      scripts: content:build test lint typecheck build
      node-version-file: .nvmrc
      artifact-name: dist
      artifact-path: dist
      check-release-tag: true

  docker:
    name: docker
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: CaffeinatedPinguin/templates/.github/workflows/docker.yml@19ceee944e703de7ea0291518ada59442f387c96
    with:
      image-name: tech-radar
      # Build the Dockerfile and dist from the same commit as verify.
      ref: ${{ github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || '' }}
      context: .
      dockerfile: Dockerfile
      target: runtime-prebuild
      artifact-name: dist
      artifact-path: dist
      smoke-paths: / /content/content.json /logo/logo.svg
      push: ${{ startsWith(github.ref, 'refs/tags/') }}

  release:
    name: release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: CaffeinatedPinguin/templates/.github/workflows/release.yml@19ceee944e703de7ea0291518ada59442f387c96
    with:
      title-prefix: "Tech Radar "
      image-name: tech-radar
