name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tech-radar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: tech-radar / build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-tech-radar-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-tech-radar-${{ runner.os }}-

      - name: Enable corepack
        shell: bash
        run: |
          set -euo pipefail
          npm install -g corepack@0.36.0
          corepack enable
          corepack prepare pnpm@12.2.1 --activate

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Validate example content
        shell: bash
        run: corepack pnpm content:build

      - name: Test
        shell: bash
        run: corepack pnpm test

      - name: Lint
        shell: bash
        run: corepack pnpm lint

      - name: Typecheck
        shell: bash
        run: corepack pnpm typecheck

      - name: Build frontend
        shell: bash
        run: corepack pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tech-radar-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  docker:
    name: tech-radar / docker smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tech-radar-dist
          path: dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: runtime-prebuild
          pull: true
          push: false
          load: true
          tags: local/tech-radar:ci
          cache-from: type=gha,scope=docker-${{ github.repository }}-tech-radar
          cache-to: type=gha,scope=docker-${{ github.repository }}-tech-radar,mode=max
          provenance: false
          sbom: false

      - name: Smoke test served image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d -p 18080:8080 --name tech-radar-smoke local/tech-radar:ci
          trap 'docker rm -f tech-radar-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec tech-radar-smoke wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          health="$(docker exec tech-radar-smoke wget -qO- http://127.0.0.1:8080/healthz)"
          test "$health" = "ok"
          docker exec tech-radar-smoke wget -qO- http://127.0.0.1:8080/content/content.json | grep -q '"schemaVersion": 1'
          docker exec tech-radar-smoke wget -qO- http://127.0.0.1:8080/logo/logo.svg | grep -q '<svg'
